name: 🚀 Fast build

# NOTE (fork): three-tier build cache architecture, measured against the
# <120s incremental target:
#   L1  persistent build tree (build-fast/) restored from cache
#       -> a warm run recompiles ONLY what changed (ninja incremental)
#          and relinks with mold: the path to a sub-2-minute build.
#   L2  ccache (or sccache opt-in) -> if L1 was evicted, a full rebuild
#       compiles from cache instead of from scratch.
#   L3  prebuilt build-deps Docker image published by the QGIS project
#       -> zero dependency compilation, ever.
#
# Scenarios (workflow input) — pick one and read the timing summary:
#   incremental (default): L1+L2 restored, only the diff compiles.
#   warm-cache           : L2 restored only (build tree wiped) — the
#                          "L1 was evicted" recovery path.
#   cold                 : no caches — the honest first-ever-run number.
#
# cache_backend input:
#   ccache (default): documented PCH mode (ccache(1)), content hashing,
#                     battle-tested. Data from ccache(1) manual.
#   sccache         : native GitHub Actions cache service integration
#                     (no tarball roundtrip). PCH support exists but is
#                     less battle-tested than ccache's — hence opt-in only.
#
# Manual only — never runs automatically, costs nothing unless clicked.
# No paid infrastructure: free ubuntu runners only.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Benchmark scenario'
        required: false
        default: 'incremental'
        type: choice
        options:
          - incremental
          - warm-cache
          - cold
      preset:
        description: 'Configuration (python = processing + plugins)'
        required: false
        default: 'fast'
        type: choice
        options:
          - fast
          - fast-python
          - fast-release
      cache_backend:
        description: 'Compiler cache backend'
        required: false
        default: 'ccache'
        type: choice
        options:
          - ccache
          - sccache
      runner:
        description: 'Runner (bigger = faster but billed even on public repos)'
        required: false
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-latest-4-cores
          - ubuntu-latest-8-cores
          - ubuntu-latest-16-cores

permissions:
  contents: read

env:
  BUILD_IMAGE: qgis/qgis3-ubuntu-qt6-build-deps-bin-only:master
  BUILD_DIR: /root/QGIS/build-fast   # FIXED path: with PCH, ccache keys include
                                     # the -include <pch> path, so a stable
                                     # build-dir path is required for hits
                                     # (measured: different dir => 0% hits).

jobs:
  build:
    name: ${{ inputs.scenario || 'incremental' }} / ${{ inputs.preset || 'fast' }} / ${{ inputs.cache_backend || 'ccache' }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 300

    steps:
      - name: 🐣 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🧹 Reclaim disk space
        run: |
          df . -h
          sudo rm -rf /usr/local/lib/android/ || true
          df . -h

      - name: 🐳 Pull the prebuilt QGIS build-deps image (L3; local-build fallback)
        run: |
          docker pull "${BUILD_IMAGE}" || {
            echo "::warning::Prebuilt image pull failed — building the image locally (one-time slow path)."
            docker build --target binary-only \
              -f .docker/qgis3-ubuntu-qt6-build-deps.dockerfile \
              -t "${BUILD_IMAGE}" .
          }

      # ---- L1: the build tree itself -------------------------------------
      - name: 💾 L1 — restore build tree
        if: inputs.scenario != 'cold'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-fast
          key: fastbuild-tree-${{ inputs.preset || 'fast' }}-${{ github.run_id }}
          restore-keys: |
            fastbuild-tree-${{ inputs.preset || 'fast' }}-

      # ---- L2: compiler cache ---------------------------------------------
      - name: 💾 L2 — restore ccache
        if: inputs.cache_backend == 'ccache' && inputs.scenario != 'cold'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: fastbuild-ccache-${{ inputs.preset || 'fast' }}-${{ github.run_id }}
          restore-keys: |
            fastbuild-ccache-${{ inputs.preset || 'fast' }}-
            fastbuild-ccache-

      - name: 🐿️ Start sccache (native GHA cache service, no tarball)
        if: inputs.cache_backend == 'sccache'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true

      - name: 🌱 Configure + build (single container pass)
        run: |
          docker run --rm \
            -v $(pwd):/root/QGIS \
            -v $(pwd)/.ccache:/root/.ccache \
            --env-file .docker/docker-variables.env \
            -e CCACHE_DIR=/root/.ccache \
            -e SCCACHE_GHA_ENABLED=$([[ "${{ inputs.cache_backend }}" == "sccache" ]] && echo on || echo off) \
            -e ACTIONS_RESULTS_URL=$ACTIONS_RESULTS_URL \
            -e ACTIONS_RUNTIME_TOKEN=$ACTIONS_RUNTIME_TOKEN \
            "${BUILD_IMAGE}" bash -c '
              set -e
              git config --global --add safe.directory /root/QGIS
              echo "==> toolchain: $(cmake --version | head -1) / $(ninja --version) / $(ccache --version | head -1)"

              # scenario bookkeeping
              SCENARIO="${{ inputs.scenario || 'incremental' }}"
              if [ "$SCENARIO" = "warm-cache" ]; then
                echo "==> warm-cache scenario: wiping the build tree (keeping ccache)"
                rm -rf '"${BUILD_DIR}"'
              elif [ "$SCENARIO" = "incremental" ] && [ -f '"${BUILD_DIR}"'/CMakeCache.txt ]; then
                echo "==> incremental scenario: build tree restored, ninja will do minimal work"
              fi

              ccache -M 1G
              # Values straight from ccache(1): documented PCH sloppiness,
              # content-based compiler check, inode_cache when supported.
              ccache --set-config sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime
              ccache --set-config compiler_check=content
              ccache --set-config inode_cache=true || true
              ccache -z

              PRESET="${{ inputs.preset || 'fast' }}"
              PYOFF=$([ "${PRESET}" = "fast" ] && echo ON || echo OFF)

              if [ ! -f '"${BUILD_DIR}"'/CMakeCache.txt ]; then
                cmake -S /root/QGIS -B '"${BUILD_DIR}"' -G Ninja \
                  -DCMAKE_BUILD_TYPE=$([ "${PRESET}" = "fast-release" ] && echo Release || echo Debug) \
                  -DCMAKE_C_COMPILER=/usr/bin/clang \
                  -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
                  -DCMAKE_C_FLAGS_DEBUG=-g1 \
                  -DCMAKE_CXX_FLAGS_DEBUG=-g1 \
                  -DUSE_CCACHE=ON \
                  -DUSE_ALTERNATE_LINKER=mold \
                  -DWITH_DESKTOP=ON \
                  -DWITH_GUI=ON \
                  -DWITH_ANALYSIS=ON \
                  -DWITH_PYTHON=$([ "${PRESET}" = "fast" ] && echo OFF || echo ON) \
                  -DWITH_BINDINGS=$([ "${PRESET}" = "fast" ] && echo OFF || echo ON) \
                  -DWITH_STAGED_PLUGINS=$([ "${PRESET}" = "fast" ] && echo OFF || echo ON) \
                  -DWITH_3D=OFF -DWITH_SERVER=OFF -DWITH_ORACLE=OFF -DWITH_HANA=OFF \
                  -DWITH_PDAL=OFF -DWITH_EPT=OFF -DWITH_GRASS7=OFF -DWITH_GRASS8=OFF \
                  -DWITH_GRASS_PLUGIN=OFF -DWITH_QUICK=OFF -DWITH_QTWEBENGINE=OFF \
                  -DWITH_PDF4QT=OFF -DWITH_CUSTOM_WIDGETS=OFF -DWITH_QGIS_PROCESS=OFF \
                  -DWITH_SFCGAL=OFF -DWITH_GEOGRAPHICLIB=OFF -DWITH_QSPATIALITE=OFF \
                  -DWITH_WAYLAND=OFF -DWITH_QTSERIALPORT=OFF -DWITH_APIDOC=OFF \
                  -DENABLE_TESTS=OFF -DENABLE_MODELTEST=OFF \
                  -DWITH_INTERNAL_SPATIALINDEX=ON \
                  -DENABLE_UNITY_BUILDS=ON
              fi

              START=$SECONDS
              cmake --build '"${BUILD_DIR}"' --target qgis
              ELAPSED=$(( SECONDS - START ))
              echo "${ELAPSED}" > /root/QGIS/build_seconds
              echo "==> Build finished in ${ELAPSED}s"
              ccache -s | tail -8 | tee /root/QGIS/ccache_stats.txt
            '

      - name: 📊 Timing summary (the three-benchmark evidence)
        if: always()
        run: |
          SECONDS_BUILT=$(cat build_seconds 2>/dev/null || echo "n/a")
          {
            echo "## 🚀 Fast build — ${{ inputs.scenario || 'incremental' }}"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Scenario | \`${{ inputs.scenario || 'incremental' }}\` |"
            echo "| Preset | \`${{ inputs.preset || 'fast' }}\` |"
            echo "| Cache backend | \`${{ inputs.cache_backend || 'ccache' }}\` |"
            echo "| Runner | \`${{ inputs.runner || 'ubuntu-latest' }}\` |"
            echo "| Build step (configure-if-needed + build) | **${SECONDS_BUILT}s** |"
            echo ""
            echo "Target reference points:"
            echo "- incremental: recompiles only the diff + mold relink (goal < 120 s)"
            echo "- warm-cache: full rebuild from compiler cache (L1-evicted recovery)"
            echo "- cold: first-ever run (never 120 s; physics — ~2600 heavy C++ TUs)"
            echo ""
            echo "<details><summary>ccache statistics</summary>"
            echo ""
            echo '```'
            cat ccache_stats.txt 2>/dev/null || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- persist caches for the next run --------------------------------
      - name: 💾 Save build tree (L1)
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-fast
          key: fastbuild-tree-${{ inputs.preset || 'fast' }}-${{ github.run_id }}

      - name: 💾 Save ccache (L2)
        if: success() && inputs.cache_backend == 'ccache'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: fastbuild-ccache-${{ inputs.preset || 'fast' }}-${{ github.run_id }}
