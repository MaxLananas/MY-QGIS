name: 📊 Performance benchmark

# NOTE (fork): builds QGIS with the minimal fast configuration (WITH_PYTHON=ON
# so PyQGIS is available), then runs the real PyQGIS benchmark suite
# (scripts/perf/qgis-perf-bench.py) headlessly inside the QGIS build-deps
# Docker image and publishes the full timing table to the run summary.
# Manual only — never runs automatically, costs nothing unless clicked.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A full A/B (fork + upstream builds + benches) takes well over an hour:
  # never cancel a running benchmark, or every push wipes the results.
  cancel-in-progress: false

on:
  # Runs automatically ONLY when a PR touches the perf files themselves
  # (no cost otherwise); A/B comparison is on by default in that case.
  pull_request:
    paths:
      - 'scripts/perf/**'
      - 'scripts/bench-build.sh'
      - '.github/workflows/perf-bench.yml'
  workflow_dispatch:
    inputs:
      features:
        description: 'Synthetic point features for the benchmark dataset'
        required: false
        default: '100000'
      compare_upstream:
        description: 'Also build upstream qgis/QGIS master and compare on the same runner'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      runner:
        description: 'Runner (bigger = faster but billed even on public repos)'
        required: false
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-latest-4-cores
          - ubuntu-latest-8-cores
          - ubuntu-latest-16-cores

permissions:
  contents: read

env:
  # The FULL build-deps image (the binary-only Docker Hub target stops before
  # the toolchain layer: no ccache, flex, libzip-dev, clang or mold — the
  # real upstream CI compiles QGIS inside the full image).
  BUILD_IMAGE: qgis/qgis3-ubuntu-qt6-build-deps:master
  BUILD_DIR: /root/QGIS/build-perf

jobs:
  bench:
    name: perf benchmark (linux)
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 360

    steps:
      - name: 🐣 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🧹 Reclaim disk space
        run: |
          df . -h
          sudo rm -rf /usr/local/lib/android/ || true
          df . -h

      - name: 🐳 Pull the full QGIS build-deps image (local-build fallback)
        run: |
          docker pull "${BUILD_IMAGE}" || {
            echo "::warning::Prebuilt image pull failed — building the FULL image locally (one-time slow path)."
            docker build \
              -f .docker/qgis3-ubuntu-qt6-build-deps.dockerfile \
              -t "${BUILD_IMAGE}" .
          }

      - name: 💾 Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: perfbench-ccache-${{ github.run_id }}
          restore-keys: |
            perfbench-ccache-
            fastbuild-ccache-fast-python-

      # One pass: build the fork, benchmark it, then (optional) build upstream
      # qgis/QGIS master with identical flags and benchmark it too — a true
      # A/B on the same runner, same compiler, same data, shared ccache
      # (the reference build warms the cache; the fork build then only pays
      # for its own deltas).
      - name: 🌋 Build + run benchmark (fork vs upstream)
        run: |
          mkdir -p perf-results
          docker run --rm             -v $(pwd):/root/QGIS             -v $(pwd)/.ccache:/root/.ccache             --env-file .docker/docker-variables.env             -e CCACHE_DIR=/root/.ccache             "${BUILD_IMAGE}" bash -c '
              set -e
              trap "printf \"FAILED rc=%s cmd=%s\n\" \"\$?\" \"\$BASH_COMMAND\" > /root/QGIS/perf-results/lastcmd.txt" ERR
              git config --global --add safe.directory /root/QGIS

              # Preflight: the bin-only image ships clang/mold/ninja but not
              # ccache; install it on the fly and pick compilers/linker that
              # actually exist. Both A/B sides use the SAME resolved flags.
              if ! command -v ccache >/dev/null 2>&1 || ! command -v flex >/dev/null 2>&1 || ! command -v mold >/dev/null 2>&1; then
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ccache flex bison mold
              fi
              if command -v mold >/dev/null 2>&1; then
                # NOTE: mold was observed failing on ZSTD symbol ordering when
                # linking QGIS with system Qt6 in this image (runs 45925892699
                # annotation) — GNU ld resolves it; revisit later if needed.
                LINKER_FLAG="-DUSE_ALTERNATE_LINKER=default"
              else
                LINKER_FLAG="-DUSE_ALTERNATE_LINKER=default"
              fi
              if [ -x /usr/bin/clang ] && [ -x /usr/bin/clang++ ]; then
                CC_FLAG="-DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++"
              else
                CC_FLAG="-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++"
              fi
              echo "==> Toolchain: $(clang --version 2>/dev/null | head -1 || gcc --version | head -1) / linker_flag=$LINKER_FLAG"

              ccache -M 2G
              ccache --set-config sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime
              ccache --set-config hash_dir=false
              ccache --set-config compiler_check=content
              ccache --set-config inode_cache=true || true
              ccache -z

              # WITH_EPT=ON is required: the EPT=OFF combination leaves
              # QgsEptPointCloudIndex undefined at link time (run 45925892699) —
              # upstream CI never exercises EPT=OFF.
              BUILD_FLAGS="-G Ninja -DCMAKE_BUILD_TYPE=Release                 -DCMAKE_C_FLAGS_DEBUG=-g1 -DCMAKE_CXX_FLAGS_DEBUG=-g1                 -DUSE_CCACHE=ON                 -DWITH_DESKTOP=ON -DWITH_GUI=ON -DWITH_ANALYSIS=ON                 -DWITH_PYTHON=ON -DWITH_BINDINGS=ON -DWITH_STAGED_PLUGINS=ON                 -DWITH_3D=OFF -DWITH_SERVER=OFF -DWITH_ORACLE=OFF -DWITH_HANA=OFF                 -DWITH_PDAL=OFF -DWITH_EPT=ON -DWITH_GRASS7=OFF -DWITH_GRASS8=OFF                 -DWITH_GRASS_PLUGIN=OFF -DWITH_QUICK=OFF -DWITH_QTWEBENGINE=OFF                 -DWITH_PDF4QT=OFF -DWITH_CUSTOM_WIDGETS=OFF -DWITH_QGIS_PROCESS=OFF                 -DWITH_SFCGAL=OFF -DWITH_GEOGRAPHICLIB=OFF -DWITH_QSPATIALITE=OFF                 -DWITH_WAYLAND=OFF -DWITH_QTSERIALPORT=OFF -DWITH_APIDOC=OFF                 -DENABLE_TESTS=OFF -DENABLE_MODELTEST=OFF                 -DWITH_INTERNAL_SPATIALINDEX=ON -DENABLE_UNITY_BUILDS=ON $CC_FLAG $LINKER_FLAG"

              mkdir -p /root/QGIS/perf-results

              run_bench() {
                local LABEL="$1" TREE="$2" BUILD="$3"
                export QGIS_OUTPUT="$BUILD/output"
                export PYTHONPATH="$QGIS_OUTPUT/python:$PYTHONPATH"
                export LD_LIBRARY_PATH="$QGIS_OUTPUT/lib:$LD_LIBRARY_PATH"
                export QT_QPA_PLATFORM=offscreen
                cd "$TREE"
                python3 scripts/perf/qgis-perf-bench.py                   --data-dir /tmp/qgis-perf-bench-data                   --features ${{ inputs.features || 100000 }}                   --repeats 5                   --json "/root/QGIS/perf-results/bench-$LABEL.json"                   --markdown "/root/QGIS/perf-results/bench-$LABEL.md"                   --label "$LABEL"
              }

              # ---- 1) the fork -------------------------------------------------
              echo "==> Building the FORK tree"
              if [ ! -f '"${BUILD_DIR}"'/CMakeCache.txt ]; then
                cmake -S /root/QGIS -B '"${BUILD_DIR}"' $BUILD_FLAGS
              fi
              cmake --build '"${BUILD_DIR}"' --target qgis
              run_bench fork /root/QGIS '"${BUILD_DIR}"'

              # ---- 2) upstream reference (optional) -----------------------------
              if [ "${{ inputs.compare_upstream || 'true' }}" = "true" ]; then
                echo "==> Building upstream qgis/QGIS master (same flags, shared ccache)"
                git clone --depth 1 https://github.com/qgis/QGIS.git /root/QGIS-ref
                git config --global --add safe.directory /root/QGIS-ref
                cmake -S /root/QGIS-ref -B /root/QGIS-ref/build-perf $BUILD_FLAGS
                cmake --build /root/QGIS-ref/build-perf --target qgis
                run_bench reference /root/QGIS-ref /root/QGIS-ref/build-perf
                echo "==> A/B complete: fork vs reference"
              else
                echo "==> Upstream comparison skipped (input)"
              fi

              echo "==> ccache statistics:"
              ccache -s | tail -6
            ' > perf-results/buildlog.txt 2>&1 || {
              grep -E "CMake Error|Could ?NOT find|Could not find|Configuring incomplete|ninja: error|error:" perf-results/buildlog.txt 2>/dev/null | grep -v "^CMake Error at /usr/share/cmake" | tail -10 > perf-results/errors.txt
              {
                echo "### 🔥 Build/bench failure diagnosis"
                echo ""
                echo '```'
                cat perf-results/lastcmd.txt 2>/dev/null || true
                cat perf-results/errors.txt 2>/dev/null || true
                tail -c 1500 perf-results/buildlog.txt 2>/dev/null || true
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              { cat perf-results/lastcmd.txt 2>/dev/null; cat perf-results/errors.txt 2>/dev/null; } | while IFS= read -r line; do echo "::error::${line:0:500}"; done
              exit 1
            }

      - name: 📊 Publish benchmark summary
        if: always()
        run: |
          {
            echo "## 📊 QGIS performance benchmark — fork vs upstream"
            echo ""
            echo "Same runner, same compiler, same deterministic dataset (seed 20261126), 5 runs per metric (median / p10 / p90)."
            echo ""
            echo "### Fork (this branch)"
            echo ""
            if [ -f perf-results/bench-fork.md ]; then
              cat perf-results/bench-fork.md
            else
              echo "Fork benchmark did not complete — check the build+run logs."
            fi
            if [ -f perf-results/bench-reference.md ]; then
              echo ""
              echo "### Reference (upstream qgis/QGIS master)"
              echo ""
              cat perf-results/bench-reference.md
              echo ""
              echo "### Fork delta vs reference (median)"
              echo ""
              python3 scripts/perf/ab_summary.py perf-results/bench-fork.json perf-results/bench-reference.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 💾 Save ccache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: perfbench-ccache-${{ github.run_id }}
